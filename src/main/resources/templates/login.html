<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BusGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Card Header -->
        <div class="bg-indigo-700 p-6 text-white text-center">
            <a href="/" class="inline-flex items-center space-x-2 text-2xl font-bold">
                <i class="fa-solid fa-bus text-yellow-400"></i>
                <span>BusGo Express</span>
            </a>
            <p class="text-indigo-200 text-sm mt-1">Sign in to your account to continue</p>
        </div>

        <div class="p-8">
            <!-- Flash Alerts -->
            <div th:if="${error}" class="mb-4 bg-rose-50 border-l-4 border-rose-500 p-3 text-rose-700 text-sm rounded">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="mb-4 bg-emerald-50 border-l-4 border-emerald-500 p-3 text-emerald-700 text-sm rounded">
                <i class="fa-solid fa-circle-check mr-1"></i> <span th:text="${success}"></span>
            </div>

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username / Login ID</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-sm"></i>
                        <input type="text" id="usernameInput" name="username" required placeholder="Enter username"
                               class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-sm"></i>
                        <input type="password" id="passwordInput" name="password" required placeholder="••••••••"
                               class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md transition text-sm">
                    Sign In
                </button>
            </form>

            <!-- Quick Auto-Fill Demo Accounts -->
            <div class="mt-6 pt-5 border-t border-slate-200">
                <p class="text-xs text-slate-500 text-center font-semibold mb-2">Quick Demo One-Click Fill:</p>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="fillForm('admin', 'admin123')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 py-1.5 px-2 rounded text-xs font-semibold">
                        👑 Admin
                    </button>
                    <button type="button" onclick="fillForm('john', 'user123')" class="bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-300 py-1.5 px-2 rounded text-xs font-semibold">
                        👤 John
                    </button>
                    <button type="button" onclick="fillForm('sarah', 'user123')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 py-1.5 px-2 rounded text-xs font-semibold">
                        👤 Sarah
                    </button>
                </div>
            </div>

            <div class="mt-6 text-center text-xs text-slate-600">
                Don't have an account? 
                <a href="/register" class="text-indigo-600 font-bold hover:underline">Create new user account</a>
            </div>
            <div class="mt-2 text-center text-xs text-slate-500">
                <a href="/" class="hover:underline">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function fillForm(u, p) {
            document.getElementById('usernameInput').value = u;
            document.getElementById('passwordInput').value = p;
        }
    </script>
</body>
</html>
