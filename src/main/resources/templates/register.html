<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BusGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-indigo-700 p-6 text-white text-center">
            <a href="/" class="inline-flex items-center space-x-2 text-2xl font-bold">
                <i class="fa-solid fa-bus text-yellow-400"></i>
                <span>BusGo Express</span>
            </a>
            <p class="text-indigo-200 text-sm mt-1">Register your passenger account</p>
        </div>

        <div class="p-8">
            <div th:if="${error}" class="mb-4 bg-rose-50 border-l-4 border-rose-500 p-3 text-rose-700 text-sm rounded">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> <span th:text="${error}"></span>
            </div>

            <form action="/register" method="POST" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" name="fullName" required placeholder="e.g. Michael Scott"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username / Login ID</label>
                    <input type="text" name="username" required placeholder="Pick a username"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required placeholder="Create password"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email</label>
                        <input type="email" name="email" required placeholder="you@email.com"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Phone</label>
                        <input type="text" name="phone" required placeholder="10-digit phone"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md transition text-sm mt-2">
                    Create User Account
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-600">
                Already have an account? 
                <a href="/login" class="text-indigo-600 font-bold hover:underline">Log In</a>
            </div>
            <div class="mt-2 text-center text-xs text-slate-500">
                <a href="/" class="hover:underline">← Back to Home</a>
            </div>
        </div>
    </div>

</body>
</html>
