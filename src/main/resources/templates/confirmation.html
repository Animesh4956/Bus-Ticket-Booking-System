<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - BusGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 text-2xl font-bold tracking-tight">
                <i class="fa-solid fa-bus text-yellow-400"></i>
                <span>BusGo Express</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="/dashboard" class="text-white hover:text-yellow-300 text-sm font-semibold">My Bookings</a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full">
        
        <!-- Confirmation Card -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
            
            <!-- Success Header -->
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-8 text-center text-white">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h1 class="text-2xl font-extrabold">Booking Confirmed!</h1>
                <p class="text-emerald-100 text-sm mt-1">Your bus ticket has been successfully booked and confirmed.</p>
                
                <div class="mt-4 inline-block bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full text-xs font-mono tracking-wider font-bold">
                    PNR: <span th:text="${booking.bookingReference}"></span>
                </div>
            </div>

            <!-- Ticket Details Body -->
            <div class="p-8 space-y-6">
                
                <!-- Route Highlight Box -->
                <div class="bg-slate-50 rounded-2xl p-6 border border-slate-200 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase">Boarding</span>
                        <div class="text-xl font-bold text-slate-900" th:text="${booking.bus.source}"></div>
                        <div class="text-sm font-semibold text-indigo-600" th:text="${booking.bus.departureTime}"></div>
                    </div>
                    <div class="text-center px-4">
                        <div class="text-slate-400 text-xs font-semibold mb-1" th:text="${#temporals.format(booking.bus.journeyDate, 'dd-MMM-yyyy')}"></div>
                        <i class="fa-solid fa-arrow-right text-indigo-500 text-lg"></i>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-slate-400 uppercase">Destination</span>
                        <div class="text-xl font-bold text-slate-900" th:text="${booking.bus.destination}"></div>
                        <div class="text-sm font-semibold text-indigo-600" th:text="${booking.bus.arrivalTime}"></div>
                    </div>
                </div>

                <!-- Passenger and Seat Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-xs font-semibold text-slate-400 block">Lead Passenger</span>
                        <span class="font-bold text-slate-800" th:text="${booking.passengerName}"></span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-xs font-semibold text-slate-400 block">Reserved Seat(s)</span>
                        <span class="font-bold text-indigo-600 text-base" th:text="${booking.seatNumber}"></span>
                        <span class="text-xs text-slate-500 block" th:text="'(' + ${booking.seatCount} + ' seat(s))'"></span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-xs font-semibold text-slate-400 block">Bus / Operator</span>
                        <span class="font-bold text-slate-800 text-xs" th:text="${booking.bus.busName}"></span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-xs font-semibold text-slate-400 block">Total Fare Paid</span>
                        <span class="font-bold text-emerald-600 text-base">₹ <span th:text="${booking.totalFare}"></span></span>
                    </div>
                </div>

                <!-- Call to action buttons -->
                <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <a th:href="@{'/booking/ticket-pdf/' + ${booking.bookingReference}}" 
                       class="w-full sm:w-auto bg-rose-600 hover:bg-rose-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-file-pdf text-lg"></i>
                        <span>Download Official PDF Ticket</span>
                    </a>

                    <div class="flex items-center space-x-3 w-full sm:w-auto">
                        <a href="/dashboard" class="flex-1 sm:flex-initial text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-5 py-3 rounded-xl text-sm transition">
                            Go to Dashboard
                        </a>
                        <a href="/buses" class="flex-1 sm:flex-initial text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-3 rounded-xl text-sm transition">
                            Book Another Bus
                        </a>
                    </div>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
