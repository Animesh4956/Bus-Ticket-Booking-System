<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - BusGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 text-2xl font-bold tracking-tight">
                <i class="fa-solid fa-bus text-yellow-400"></i>
                <span>BusGo Express</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="/buses" class="bg-yellow-400 hover:bg-yellow-500 text-indigo-900 font-bold px-3 py-1.5 rounded-lg text-sm transition">
                    + Book New Bus
                </a>
                <a href="/logout" class="text-rose-200 hover:text-white text-sm font-semibold">Logout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- User Profile Card -->
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-700 font-extrabold text-2xl rounded-2xl flex items-center justify-center">
                    <span th:text="${#strings.substring(user.fullName, 0, 1)}"></span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900" th:text="${user.fullName}"></h1>
                    <p class="text-xs text-slate-500">
                        Username: <span class="font-bold text-slate-700" th:text="${user.username}"></span> &bull; 
                        Email: <span th:text="${user.email}"></span> &bull; 
                        Phone: <span th:text="${user.phone}"></span>
                    </p>
                </div>
            </div>

            <div>
                <a href="/buses" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl shadow-md transition inline-flex items-center space-x-2">
                    <i class="fa-solid fa-ticket"></i>
                    <span>Find & Book Bus</span>
                </a>
            </div>
        </div>

        <!-- Bookings Section -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                    <span>My Bookings History</span>
                </h2>
                <span class="text-xs text-slate-500">Total Bookings: <strong th:text="${#lists.size(bookings)}"></strong></span>
            </div>

            <div th:if="${#lists.isEmpty(bookings)}" class="p-12 text-center">
                <i class="fa-solid fa-receipt text-4xl text-slate-300 mb-3"></i>
                <p class="text-slate-600 font-medium">You haven't booked any bus tickets yet.</p>
                <a href="/buses" class="mt-3 inline-block bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow">
                    Book Your First Ticket
                </a>
            </div>

            <div th:if="${!#lists.isEmpty(bookings)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs uppercase font-bold text-slate-400 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4">Ticket Ref</th>
                            <th class="px-6 py-4">Bus & Route</th>
                            <th class="px-6 py-4">Travel Date</th>
                            <th class="px-6 py-4">Seat</th>
                            <th class="px-6 py-4">Fare</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="b : ${bookings}" class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4 font-mono font-bold text-slate-900" th:text="${b.bookingReference}"></td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-800" th:text="${b.bus.source + ' ➔ ' + b.bus.destination}"></div>
                                <div class="text-xs text-slate-400" th:text="${b.bus.busName}"></div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="font-medium text-slate-700" th:text="${#temporals.format(b.bus.journeyDate, 'dd-MMM-yyyy')}"></span>
                                <span class="block text-xs text-indigo-600" th:text="${b.bus.departureTime}"></span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-md text-xs" th:text="${b.seatNumber}"></span>
                            </td>
                            <td class="px-6 py-4 font-bold text-slate-900">
                                ₹ <span th:text="${b.totalFare}"></span>
                            </td>
                            <td class="px-6 py-4">
                                <span th:if="${b.status == 'CONFIRMED'}" class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-xs">
                                    CONFIRMED
                                </span>
                                <span th:if="${b.status == 'CANCELLED'}" class="bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded text-xs">
                                    CANCELLED
                                </span>
                            </td>
                            <td class="px-6 py-4 text-center space-x-2">
                                <!-- Download PDF Button -->
                                <a th:if="${b.status == 'CONFIRMED'}" th:href="@{'/booking/ticket-pdf/' + ${b.bookingReference}}" 
                                   title="Download PDF E-Ticket"
                                   class="inline-flex items-center space-x-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition">
                                    <i class="fa-solid fa-file-pdf"></i>
                                    <span>Download PDF</span>
                                </a>

                                <!-- Cancel Button -->
                                <form th:if="${b.status == 'CONFIRMED'}" th:action="@{'/booking/cancel/' + ${b.id}}" method="POST" class="inline"
                                      onsubmit="return confirm('Are you sure you want to cancel this ticket?');">
                                    <button type="submit" class="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2 py-1">
                                        Cancel
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
